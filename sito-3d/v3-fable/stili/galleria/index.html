<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERI · Energie Rinnovabili Italia</title>
<meta name="description" content="ERI sviluppa, autorizza, costruisce e gestisce impianti fotovoltaici, agrivoltaici, di accumulo e idroelettrici.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@300;400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<!-- Struttura della pagina. Le scritte NON si cambiano qui: stanno tutte in contenuti.js (pagina.js le inserisce). -->

<!-- La sala: parete avorio che si curva nel pavimento; la finestra alta si vede solo come striscia di luce -->
<div class="sala" aria-hidden="true"></div>
<div class="finestra" aria-hidden="true"></div>
<div class="vetrata" aria-hidden="true"></div>

<!-- I titoli grandi: sopra la tela 3D, e la regia tiene le macchine sempre lontane da loro -->
<div id="titoli" aria-hidden="true">
  <h2 class="titolo-grande" data-m="1"></h2>
  <h2 class="titolo-grande" data-m="2"></h2>
  <h2 class="titolo-grande" data-m="3"></h2>
  <h2 class="titolo-grande" data-m="4"></h2>
  <h2 class="titolo-grande" data-m="5"></h2>
</div>

<canvas id="scena" aria-hidden="true"></canvas>
<div id="scorrimento" aria-hidden="true"></div>

<!-- Logo: grande al centro nell'apertura, poi viaggia in alto a sinistra -->
<a id="logo" href="#" aria-label="ERI · Energie Rinnovabili Italia"></a>

<header class="testata">
  <nav class="nav" aria-label="Sezioni">
    <a href="#" data-va="fotovoltaico"></a>
    <a href="#" data-va="bess"></a>
    <a href="#" data-va="idroelettrico"></a>
    <a href="#" data-va="servizi"></a>
    <a href="#" data-va="contatti" class="nav-contatti"></a>
  </nav>
</header>

<main id="momenti">

  <section class="momento momento-apertura" data-m="0">
    <!-- nell'apertura nessuna macchina copre il titolo: sta sopra la tela, come il resto dei testi -->
    <h1 class="titolo-grande" data-m="0"></h1>
    <div class="blocco">
      <p class="sotto"></p>
      <a href="#" class="bottone" data-va="contatti"></a>
    </div>
    <p class="invito"></p>
  </section>

  <section class="momento momento-tech" data-m="1">
    <div class="cartellino"><div class="mono"></div><p></p></div>
    <ol class="iter" aria-label="L'iter che seguiamo"></ol>
    <div class="barra" aria-hidden="true"></div>
  </section>

  <section class="momento momento-tech" data-m="2">
    <div class="cartellino"><div class="mono"></div><p></p></div>
    <ol class="iter" aria-label="L'iter che seguiamo"></ol>
    <div class="barra" aria-hidden="true"></div>
  </section>

  <section class="momento momento-tech" data-m="3">
    <div class="cartellino"><div class="mono"></div><p></p></div>
    <ol class="iter" aria-label="L'iter che seguiamo"></ol>
    <div class="barra" aria-hidden="true"></div>
    <div class="etichette" aria-hidden="true"></div>
  </section>

  <section class="momento momento-servizi" data-m="4">
    <div class="servizi">
      <div class="mono"></div>
      <p class="sotto"></p>
      <ol class="elenco-servizi"></ol>
    </div>
  </section>

  <section class="momento momento-contatti" data-m="5">
    <div class="scheda">
      <div class="mono"></div>
      <p class="sotto"></p>
      <form class="modulo" novalidate>
        <label><span data-campo="nome"></span><input type="text" name="nome" autocomplete="name" required></label>
        <label><span data-campo="email"></span><input type="email" name="email" autocomplete="email" required></label>
        <label class="campo-messaggio"><span data-campo="messaggio"></span><textarea name="messaggio" rows="3" required></textarea></label>
        <div class="riga-invio">
          <button type="submit" class="bottone"></button>
          <small></small>
        </div>
        <p class="conferma" hidden></p>
      </form>
      <p class="recapiti"></p>
    </div>
  </section>

</main>

<!-- Il nome della fase, grande e in mono, sotto la macchina: compare un attimo al cambio di fase -->
<div class="fase" aria-hidden="true"></div>

<div id="caricamento"><span></span></div>

<script type="module" src="main.js"></script>
</body>
</html>
