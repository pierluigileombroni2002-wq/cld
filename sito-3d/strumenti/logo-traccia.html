<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Traccia logo</title>
<style>
  body { margin:0; background:#fff; font:13px system-ui, sans-serif; }
  canvas { image-rendering:pixelated; width:932px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Strumento per ricostruire il logo originale in vettoriale.
// Legge originale.png, divide i pixel in regioni connesse e ne misura forma e colori.
const img = new Image();
img.src = '../logo/originale.png';
await img.decode();
const W = img.width, H = img.height;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');
g.drawImage(img, 0, 0);
const px = g.getImageData(0, 0, W, H).data;

const alfa = (x, y) => px[(y * W + x) * 4 + 3];
const rgb = (x, y) => { const i = (y * W + x) * 4; return [px[i], px[i + 1], px[i + 2]]; };

// Regioni connesse (4-vicini) dei pixel con alfa sopra soglia
function regioni(soglia = 128) {
  const lab = new Int32Array(W * H).fill(-1);
  const out = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (lab[y * W + x] >= 0 || alfa(x, y) < soglia) continue;
    const id = out.length, pila = [[x, y]], pts = [];
    lab[y * W + x] = id;
    while (pila.length) {
      const [a, b] = pila.pop();
      pts.push([a, b]);
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const u = a + dx, v = b + dy;
        if (u < 0 || v < 0 || u >= W || v >= H) continue;
        if (lab[v * W + u] >= 0 || alfa(u, v) < soglia) continue;
        lab[v * W + u] = id; pila.push([u, v]);
      }
    }
    out.push(pts);
  }
  return { lab, out };
}

function info(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, r = 0, gg = 0, b = 0;
  for (const [x, y] of pts) {
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
    const c = rgb(x, y); r += c[0]; gg += c[1]; b += c[2];
  }
  const n = pts.length;
  return { n, box: [x0, y0, x1, y1], colore: [r / n, gg / n, b / n].map(Math.round) };
}

const R = regioni();
window.__traccia = { W, H, px, alfa, rgb, regioni, info, R,
  elenco: R.out.map((p, i) => ({ i, ...info(p) })).filter(r => r.n > 4) };
window.__pronto = true;
</script>
</body>
</html>
