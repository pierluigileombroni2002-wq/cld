<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bozza logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
  body { margin:0; background:#fff; font:13px system-ui, sans-serif; }
  .q { position:relative; width:932px; height:808px; }
  .q > * { position:absolute; inset:0; width:100%; height:100%; }
  .q img { image-rendering:auto; }
  .diff img { mix-blend-mode:difference; }
  .barra { padding:6px; display:flex; gap:12px; }
</style>
</head>
<body>
<!-- Confronto: vettoriale nuovo sotto, originale sopra (modo: sovrapposto, differenza, solo uno) -->
<div class="barra">
  <button data-m="diff">differenza</button><button data-m="mezzo">50 %</button>
  <button data-m="vett">vettoriale</button><button data-m="orig">originale</button>
</div>
<div class="q" id="q"><div id="v"></div><img id="o" src="../logo/originale.png" alt=""></div>
<script>
const q = document.getElementById('q'), o = document.getElementById('o');
async function carica() {
  const t = await (await fetch('../logo/ufficiale/logo-eri-originale.svg', { cache:'no-store' })).text();
  document.getElementById('v').innerHTML = t;
  document.querySelector('#v svg').setAttribute('width', '100%');
}
function modo(m) {
  q.className = m === 'diff' ? 'q diff' : 'q';
  o.style.opacity = m === 'mezzo' ? .5 : m === 'vett' ? 0 : 1;
  document.getElementById('v').style.opacity = m === 'orig' ? 0 : 1;
}
// Mappa dell'errore alla risoluzione dell'originale: rosso = c'è solo nel vettoriale, blu = c'è solo nell'originale
async function errore() {
  const t = await (await fetch('../logo/ufficiale/logo-eri-originale.svg', { cache:'no-store' })).text();
  const iv = new Image(); iv.src = URL.createObjectURL(new Blob([t], { type:'image/svg+xml' })); await iv.decode();
  const io = new Image(); io.src = '../logo/originale.png'; await io.decode();
  const W = io.width, H = io.height;
  const leggi = im => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.drawImage(im, 0, 0, W, H); return g.getImageData(0, 0, W, H).data; };
  const A = leggi(io), B = leggi(iv);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const out = g.createImageData(W, H);
  let errA = 0, errC = 0, n = 0;
  for (let i = 0; i < W * H; i++) {
    const a = A[i*4+3] / 255, b = B[i*4+3] / 255, d = b - a, both = Math.min(a, b);
    errA += Math.abs(d);
    if (a > .9 && b > .9) { errC += (Math.abs(A[i*4]-B[i*4]) + Math.abs(A[i*4+1]-B[i*4+1]) + Math.abs(A[i*4+2]-B[i*4+2])) / 3; n++; }
    out.data[i*4]   = 255 - 255 * Math.max(0, -d) - 120 * both;
    out.data[i*4+1] = 255 - 255 * Math.abs(d) - 120 * both;
    out.data[i*4+2] = 255 - 255 * Math.max(0, d) - 120 * both;
    out.data[i*4+3] = 255;
  }
  g.putImageData(out, 0, 0);
  let el = document.getElementById('errore');
  if (!el) { el = document.createElement('img'); el.id = 'errore'; el.style.cssText = 'display:block;width:932px;image-rendering:pixelated'; document.body.appendChild(el); }
  el.src = c.toDataURL();
  return { erroreAlfaPx: +errA.toFixed(1), coloreMedio: +(errC / n).toFixed(1) };
}
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => modo(b.dataset.m));
window.ricarica = carica;
window.modo = modo;
window.errore = errore;
carica().then(() => modo(new URLSearchParams(location.search).get('m') || 'diff'));
</script>
</body>
</html>
