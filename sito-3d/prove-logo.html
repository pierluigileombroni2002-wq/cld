<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove Logo ERI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Marcellus&family=Syncopate:wght@700&family=Bodoni+Moda:wght@500&family=Cinzel:wght@500&family=Sora:wght@300;500;600;700&family=Bodoni+Moda:wght@500&family=Cinzel:wght@500&family=Sora:wght@300;500;600;700&display=swap">
<style>
  /* Layout: griglia 2x2 di "piastrelle" nere opache, il logo è protagonista */
  :root {
    --nero: #060708; --nero-2: #15191c; --bordo: #23292d;
    --testo: #e8ecee; --grigio: #8e999f; --oro: #f5a623;
    --font: "Jost", Futura, "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: var(--font); color: var(--testo);
    background: radial-gradient(ellipse at 50% 0%, var(--nero-2), var(--nero) 70%) fixed, var(--nero);
    padding: 56px 24px 72px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 40px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 24px; }
  h1 { font-weight: 300; font-size: clamp(28px, 3.4vw, 44px); letter-spacing: .04em; margin: 0; text-wrap: balance; }
  header p { margin: 8px 0 0; color: var(--grigio); max-width: 60ch; line-height: 1.55; }
  .orig { display: flex; align-items: center; gap: 14px; color: var(--grigio); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .orig img { width: 92px; background: #fff; border-radius: 10px; padding: 6px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
  .card { margin: 0; display: grid; gap: 16px; }
  .tile {
    aspect-ratio: 4 / 3; max-width: 100%; border-radius: 18px; border: 1px solid var(--bordo);
    display: grid; place-items: center; overflow: hidden;
    /* nero opaco sfumato con una luce dall'alto, come un materiale satinato */
    background: radial-gradient(ellipse at 50% 18%, #20262a 0%, #0c0e10 55%, #050607 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 60px -30px rgba(0,0,0,.9);
    transition: transform .5s cubic-bezier(.2,.8,.2,1), border-color .5s;
  }
  .card:hover .tile { transform: translateY(-4px); border-color: #3a4248; }
  .logo { width: 82%; height: auto; }
  .tag { font-size: 12px; letter-spacing: .22em; color: var(--oro); }
  h2 { font-weight: 400; font-size: 24px; margin: 4px 0 6px; }
  figcaption .col { color: var(--testo); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 6px; }
  h3 { font-weight: 400; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--oro); margin: 16px 0 -12px; border-top: 1px solid var(--bordo); padding-top: 28px; }
  figcaption .col { color: var(--testo); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 6px; }
  h3 { font-weight: 400; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--oro); margin: 12px 0 -8px; border-top: 1px solid var(--bordo); padding-top: 28px; }
  figcaption p { margin: 0; color: var(--grigio); line-height: 1.55; max-width: 55ch; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } body { padding-inline: 16px; } }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>

<div class="wrap">
  <header>

      <h1>ERI · prove di logo</h1>
      <p>Otto direzioni su nero opaco. In alto la nuova serie in oro champagne, platino e smeraldo. Si possono combinare.</p>
