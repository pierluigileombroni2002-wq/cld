<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette ERI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500&display=swap">
<style>
  body { margin:0; background:#e9e7e2; color:#1b2420; font:15px/1.5 Jost, system-ui, sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:28px 16px 64px; }
  h1.pag { font:500 22px Jost, sans-serif; margin:0 0 4px; }
  p.nota { color:#5d6661; margin:0 0 20px; max-width:820px; }
  .griglia { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap:22px; }
  figure { margin:0; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  figcaption { padding:12px 16px 16px; }
  figcaption b { font-weight:500; font-size:16px; }
  figcaption p { margin:4px 0 8px; color:#5d6661; font-size:14px; }
  .campioni { display:flex; gap:6px; flex-wrap:wrap; }
  .campioni span { display:inline-flex; align-items:center; gap:6px; font:400 11px 'IBM Plex Mono', monospace; color:#5d6661; }
  .campioni i { width:18px; height:18px; border-radius:4px; border:1px solid rgba(0,0,0,.12); display:inline-block; }
  /* scena finta 16:9 */
  .scena { position:relative; aspect-ratio:16/9; overflow:hidden; container-type:inline-size; }
  .scena svg.mondo { position:absolute; inset:0; width:100%; height:100%; }
  .scena .velo { position:absolute; inset:0; }
  .scena header { position:absolute; left:3.2cqw; right:3.2cqw; top:2.6cqw; display:flex; justify-content:space-between; align-items:center; }
  .scena header .marchio { display:flex; align-items:center; gap:1.4cqw; }
  .scena header .marchio img { height:4.6cqw; }
  .scena header .marchio span { font:400 2cqw 'Bodoni Moda', serif; letter-spacing:.5em; }
  .scena header .cta { font:400 1.05cqw 'IBM Plex Mono', monospace; letter-spacing:.14em; text-transform:uppercase; padding:1cqw 1.6cqw; border:1px solid; }
  .scena .colonna { position:absolute; left:6cqw; top:30%; width:44%; }
  .scena .occhiello { font:400 1.05cqw 'IBM Plex Mono', monospace; letter-spacing:.24em; text-transform:uppercase; margin:0 0 1.6cqw; }
  .scena h2 { font:400 5.6cqw/0.98 'Bodoni Moda', serif; margin:0 0 2cqw; letter-spacing:-.01em; }
  .scena h2 em { font-style:italic; }
  .scena .testo { font:300 1.45cqw/1.6 Jost, sans-serif; margin:0; max-width:34cqw; }
  .scena .hud { position:absolute; left:3.2cqw; bottom:2.6cqw; font:400 .95cqw 'IBM Plex Mono', monospace; letter-spacing:.1em; text-transform:uppercase; }
  .scena .hud b { font-weight:400; }
</style>
</head>
<body>
<main>
  <h1 class="pag">Sfondo e palette · 4 proposte</h1>
  <p class="nota">Prova veloce in 2D: stessi testi e stesso logo, cambiano solo cielo, terreno, linee e testi. Serve per scegliere la direzione. Dopo la scelta faccio le anteprime vere in 3D.</p>
  <div class="griglia" id="griglia"></div>
</main>
<script type="module">
// Ogni palette: cielo, terreno, linee del "gemello" (isoipse, catasto), fiume, testi, velo dietro alla colonna di testo
const PALETTE = [
  {
    id: 'A', nome: 'A · Carta tecnica',
    cosa: 'Avorio e grigio caldo, come un plastico d’architetto. Linee verde scuro e oro brunito. Molto pulito e serio.',
    cielo: ['#dfe3e1', '#f3efe6'], bagliore: '#fff6e6', terreno: ['#ece6d9', '#d9d2c3'],
    isoipse: '#a77a2a', isoipseAlfa: .75, direttrici: '#7c5a1c', griglia: '#55665e', grigliaAlfa: .35, fiume: '#9fb6bd',
    titolo: '#13251e', em: '#a77a2a', testo: '#33433c', occhiello: '#8a6420', hud: '#55625c', valore: '#13251e',
    velo: '243,239,230', logoScuro: false, bagliorLinee: 0,
  },
  {
    id: 'B', nome: 'B · Alba luminosa',
    cosa: 'Cielo vero del mattino, dall’azzurro al pesca. Terreno luminoso e naturale. Linee d’oro caldo. Più emozionale.',
    cielo: ['#a9c3d6', '#f4d9bd'], bagliore: '#ffe2b8', terreno: ['#b9b48d', '#8f9a74'],
    isoipse: '#b9831f', isoipseAlfa: .85, direttrici: '#8d5f12', griglia: '#f7f3ea', grigliaAlfa: .55, fiume: '#7ea3b5',
    titolo: '#10241c', em: '#9a5a1e', testo: '#25362f', occhiello: '#8d5f12', hud: '#2f3f38', valore: '#10241c',
    velo: '246,236,222', logoScuro: false, bagliorLinee: 0,
  },
  {
    id: 'C', nome: 'C · Ardesia media',
    cosa: 'Grigio-blu medio, né chiaro né scuro. L’oro resta luminoso, i testi chiari. Elegante e tecnico.',
    cielo: ['#56636c', '#8d989e'], bagliore: '#c9b08a', terreno: ['#6b7671', '#59645f'],
    isoipse: '#efcf8a', isoipseAlfa: .9, direttrici: '#ffe6ad', griglia: '#dfe5e8', grigliaAlfa: .35, fiume: '#3e5560',
    titolo: '#f7f3ea', em: '#f1dfb3', testo: '#e3e7e8', occhiello: '#efcf8a', hud: '#d4dadc', valore: '#f1dfb3',
    velo: '64,74,81', logoScuro: true, bagliorLinee: 1.2,
  },
  {
    id: 'D', nome: 'D · Petrolio morbido',
    cosa: 'Scuro ma non nero: blu petrolio con un orizzonte che si schiarisce. È la più vicina al sito di oggi.',
    cielo: ['#1d2c34', '#4a5d63'], bagliore: '#b08a5c', terreno: ['#2c3a3d', '#233034'],
    isoipse: '#d8b878', isoipseAlfa: .9, direttrici: '#f1dfb3', griglia: '#c9d0d4', grigliaAlfa: .3, fiume: '#16252c',
    titolo: '#f4efe4', em: '#f1dfb3', testo: '#c9d0d4', occhiello: '#d8b878', hud: '#8fa0a6', valore: '#f1dfb3',
    velo: '24,36,42', logoScuro: true, bagliorLinee: 1.6,
  },
];

// logo: versione normale e versione con scritte chiare (per gli sfondi scuri)
const svgLogo = await (await fetch('../logo/ufficiale/logo-eri-originale.svg')).text();
const url = t => URL.createObjectURL(new Blob([t], { type: 'image/svg+xml' }));
const LOGO = { chiaro: url(svgLogo), scuro: url(svgLogo.replaceAll('#0f3b2c', '#f4efe4')) };

// mondo finto in prospettiva: orizzonte, isoipse ondulate, griglia catastale, fiume
function mondo(P, n) {
  const W = 1600, H = 900, oy = 360, vx = 1000;
  const prosp = k => oy + (H - oy) * Math.pow(k, 2.2);  // k 0..1 → y con prospettiva
  let s = `<svg class="mondo" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="cielo${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.cielo[0]}"/><stop offset="1" stop-color="${P.cielo[1]}"/></linearGradient>
      <radialGradient id="bag${n}" cx="${vx / W}" cy="${oy / H}" r=".55"><stop offset="0" stop-color="${P.bagliore}" stop-opacity=".9"/><stop offset="1" stop-color="${P.bagliore}" stop-opacity="0"/></radialGradient>
      <linearGradient id="ter${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.terreno[1]}"/><stop offset="1" stop-color="${P.terreno[0]}"/></linearGradient>
      <filter id="glow${n}" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="${2.2 * P.bagliorLinee}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect width="${W}" height="${oy + 2}" fill="url(#cielo${n})"/>
    <rect width="${W}" height="${H}" fill="url(#bag${n})"/>
    <rect y="${oy}" width="${W}" height="${H - oy}" fill="url(#ter${n})"/>`;
  // griglia catastale: righe orizzontali in prospettiva + raggi verso il punto di fuga
  let g = '';
  for (let i = 1; i <= 22; i++) { const y = prosp(i / 22); g += `M0 ${y.toFixed(1)}H${W}`; }
  for (let i = -26; i <= 26; i++) { const xb = vx + i * 140; g += `M${vx + i * 6} ${oy}L${xb} ${H}`; }
  s += `<path d="${g}" stroke="${P.griglia}" stroke-opacity="${P.grigliaAlfa}" stroke-width="1.2" fill="none"/>`;
  // fiume
  s += `<path d="M${vx - 30} ${oy} C ${vx - 80} ${oy + 120}, ${vx - 420} ${oy + 220}, ${vx - 260} ${H}" stroke="${P.fiume}" stroke-width="34" fill="none" stroke-linecap="round" opacity=".9"/>`;
  // isoipse: curve ondulate in prospettiva
  let iso = '', dir = '';
  for (let i = 0; i < 30; i++) {
    const k = (i + .5) / 30, y0 = prosp(k), amp = 6 + 70 * k * k;
    let d = `M-20 ${y0.toFixed(1)}`;
    for (let x = 0; x <= W + 40; x += 40) {
      const y = y0 + Math.sin(x / (180 + 60 * k) + i * 1.7) * amp * .5 + Math.sin(x / 70 + i) * amp * .12;
      d += `L${x} ${y.toFixed(1)}`;
    }
    if (i % 5 === 0) dir += d; else iso += d;
  }
  s += `<g filter="${P.bagliorLinee ? `url(#glow${n})` : 'none'}" fill="none">
      <path d="${iso}" stroke="${P.isoipse}" stroke-opacity="${P.isoipseAlfa}" stroke-width="1.6"/>
      <path d="${dir}" stroke="${P.direttrici}" stroke-opacity="${P.isoipseAlfa}" stroke-width="2.8"/>
    </g></svg>`;
  return s;
}

const campione = (c, nome) => `<span><i style="background:${c}"></i>${nome}</span>`;

document.getElementById('griglia').innerHTML = PALETTE.map((P, n) => `
  <figure>
    <div class="scena">
      ${mondo(P, n)}
      <div class="velo" style="background:linear-gradient(90deg, rgba(${P.velo},.86) 0%, rgba(${P.velo},.72) 26%, rgba(${P.velo},.34) 40%, rgba(${P.velo},0) 54%)"></div>
      <header>
        <div class="marchio"><img src="${P.logoScuro ? LOGO.scuro : LOGO.chiaro}" alt=""><span style="color:${P.titolo}">ERI</span></div>
        <div class="cta" style="color:${P.titolo};border-color:${P.occhiello}">Parliamo del progetto</div>
      </header>
      <div class="colonna">
        <p class="occhiello" style="color:${P.occhiello}">Energie Rinnovabili Italia</p>
        <h2 style="color:${P.titolo}">Dalla particella<br><em style="color:${P.em}">al&nbsp;Ready to Build.</em></h2>
        <p class="testo" style="color:${P.testo}">Sviluppiamo impianti fotovoltaici, agrivoltaici e idroelettrici. Dal primo esame del terreno al progetto autorizzato, pronto da costruire.</p>
      </div>
      <div class="hud" style="color:${P.hud}">Maturità del progetto · <b style="color:${P.valore}">5 %</b> &nbsp;&nbsp; Fase · territorio</div>
    </div>
    <figcaption>
      <b>${P.nome}</b>
      <p>${P.cosa}</p>
      <div class="campioni">${campione(P.cielo[0], 'cielo')}${campione(P.terreno[0], 'terreno')}${campione(P.isoipse, 'linee')}${campione(P.titolo, 'titoli')}${campione(P.em, 'accento')}</div>
    </figcaption>
  </figure>`).join('');
</script>
</body>
</html>
